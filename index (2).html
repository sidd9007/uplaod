<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple HTML, CSS and JavaScript project</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="home" class="card">
      <h2>Home</h2>
      <p>This is my first web development project. I am learning how to build websites.</p>
      <button id="welcomeButton">Click Me</button>
      <p id="message" aria-live="polite"></p>
    </section>

    <section id="about" class="card">
      <h2>About</h2>
      <p>I enjoy learning HTML, CSS, JavaScript and GitHub.</p>
    </section>

    <section id="contact" class="card">
      <h2>Contact</h2>
      <p>Email: student@example.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My First Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
